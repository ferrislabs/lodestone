{{- include "lodestone.guardSecrets" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lodestone.fullname" . }}-api
  labels:
    {{- include "lodestone.labels" (dict "ctx" . "component" "api") | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
