{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "lodestone.fullname" . }}
  labels:
    {{- include "lodestone.labels" (dict "ctx" . "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "lodestone.fullname" $ }}-api
                port:
                  number: {{ $.Values.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "lodestone.fullname" $ }}-webapp
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
