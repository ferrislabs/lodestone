{{- $internal := int .Values.config.SERVER_INTERNAL_PORT -}}
{{- $public := int .Values.config.SERVER_PORT -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lodestone.fullname" . }}-api
  labels:
    {{- include "lodestone.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "lodestone.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "lodestone.selectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "lodestone.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ include "lodestone.terminationGracePeriodSeconds" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "lodestone.image" (dict "ctx" . "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.api.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $public }}
            - name: internal
              containerPort: {{ $internal }}
          envFrom:
            - configMapRef:
                name: {{ include "lodestone.fullname" . }}-api
          env:
            {{- include "lodestone.secretEnv" . | nindent 12 }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: internal
            {{- toYaml .Values.api.startupProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: internal
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: internal
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", {{ .Values.api.preStopSleepSeconds | quote }}]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
