apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lodestone.fullname" . }}-migrate
  labels:
    {{- include "lodestone.labels" (dict "ctx" . "component" "migrator") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrator.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrator.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "lodestone.selectorLabels" (dict "ctx" . "component" "migrator") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "lodestone.image" (dict "ctx" . "image" .Values.migrator.image) | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.migrator.securityContext | nindent 12 }}
          env:
            - name: DATABASE_USER
              value: {{ .Values.config.DATABASE_USER | toString | quote }}
            - name: DATABASE_HOST
              value: {{ .Values.config.DATABASE_HOST | toString | quote }}
            - name: DATABASE_PORT
              value: {{ .Values.config.DATABASE_PORT | toString | quote }}
            - name: DATABASE_NAME
              value: {{ .Values.config.DATABASE_NAME | toString | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.DATABASE_PASSWORD.name }}
                  key: {{ .Values.secrets.DATABASE_PASSWORD.key }}
            - name: DATABASE_URL
              value: postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)
          resources:
            {{- toYaml .Values.migrator.resources | nindent 12 }}
