{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "lodestone.fullname" . }}-api
  labels:
    {{- include "lodestone.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "lodestone.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ int .Values.config.SERVER_PORT }}
          protocol: TCP
    - from:
        - {{- toYaml .Values.networkPolicy.metricsFrom | nindent 10 }}
      ports:
        - port: {{ int .Values.config.SERVER_INTERNAL_PORT }}
          protocol: TCP
{{- end }}
