name: webapp

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: webapp (${{ matrix.task }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/webapp
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: check
            cmd: pnpm exec biome check src
          - task: types
            cmd: pnpm exec tsc --noEmit
          - task: test
            cmd: pnpm exec vitest run --passWithNoTests
          - task: build
            cmd: pnpm build
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/webapp/pnpm-lock.yaml

      # Frozen: an install that silently resolves a different tree is exactly
      # what pinning the versions was meant to prevent.
      - run: pnpm install --frozen-lockfile

      - run: ${{ matrix.cmd }}
