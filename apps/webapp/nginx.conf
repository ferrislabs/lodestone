server {
  # 8080, matching the unprivileged image. Binding 80 happens to work because
  # Docker lowers the unprivileged port threshold, but relying on a host sysctl
  # for a container to start is not a property worth having.
  listen 8080;

  gzip on;
  gzip_disable "msie6";

  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_buffers 16 8k;
  gzip_http_version 1.1;
  gzip_min_length 256;
  gzip_types
    application/javascript
    text/css
    text/plain
    text/xml;

  # `always` so they reach error responses too, which the previous form missed.
  add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains; preload' always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  # Nothing limited what an injected script could do, and the tokens sat in web
  # storage beside it. `connect-src` stays broad because the API and issuer
  # origins are runtime configuration, not known at build time.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src *; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;

  root /usr/share/nginx/html;
  index _shell.html;

  location / {
    try_files $uri $uri/ /_shell.html;
  }
}
